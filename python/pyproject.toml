[project]
name = "rogeledb-analytics"
version = "0.1.0"
description = "Analytics and reporting service for the ROGELE learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
    "cachetools>=7.2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rogeledb_analytics"]
