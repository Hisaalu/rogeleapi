resources:
  - name: settings
    table: settings
    primary_key: id
    searchable: [setting_key, setting_value]
    filterable: [setting_key]
    default_sort: [-created_at]
    read_roles: [admin, teacher, learner, external]
    write_roles: [admin]
    columns:
      setting_key:   { type: string, writable: true, required: true }
      setting_value: { type: string, writable: true }

  - name: subscription-plans
    table: subscription_plans
    primary_key: id
    searchable: [name, description]
    filterable: [is_active]
    default_sort: [price]
    read_roles: [admin, teacher, learner, external]
    write_roles: [admin]
    columns:
      name:          { type: string,  writable: true, required: true }
      description:   { type: string,  writable: true }
      price:         { type: number,  writable: true, required: true }
      duration_days: { type: integer, writable: true, required: true }
      is_active:     { type: boolean, writable: true }

  - name: classes
    table: classes
    primary_key: id
    system_columns: [created_at]
    searchable: [name, level]
    filterable: [level, is_active]
    default_sort: [name]
    read_roles: [admin, teacher, learner, external]
    write_roles: [admin]
    columns:
      name:        { type: string,  writable: true, required: true }
      level:       { type: string,  writable: true, required: true }
      description: { type: string,  writable: true }
      is_active:   { type: boolean, writable: true }

  - name: subjects
    table: subjects
    primary_key: id
    system_columns: [created_at]
    searchable: [name, code, description]
    filterable: [class_id, teacher_id, is_active]
    default_sort: [name]
    read_roles: [admin, teacher, learner, external]
    write_roles: [admin, teacher]
    columns:
      name:        { type: string,  writable: true, required: true }
      code:        { type: string,  writable: true }
      description: { type: string,  writable: true }
      class_id:    { type: integer, writable: true }
      teacher_id:  { type: integer, writable: true }
      is_active:   { type: boolean, writable: true }

  - name: email-templates
    table: email_templates
    primary_key: id
    searchable: [name, subject]
    filterable: [created_by]
    default_sort: [-created_at]
    read_roles: [admin]
    write_roles: [admin]
    columns:
      name:       { type: string, writable: true, required: true }
      subject:    { type: string, writable: true, required: true }
      body:       { type: string, writable: true, required: true }
      created_by: { type: integer, writable: true }

  - name: users
    table: users
    primary_key: id
    system_columns: [created_at]
    searchable: [email, first_name, last_name]
    filterable: [role, class_id, is_active, is_suspended]
    default_sort: [-created_at]
    read_roles: [admin]
    write_roles: [admin]
    columns:
      email:          { type: string,  writable: false }
      registration_number: { type: string, writable: true }
      first_name:     { type: string,  writable: true }
      last_name:      { type: string,  writable: true }
      phone:          { type: string,  writable: true }
      bio:            { type: string,  writable: true }
      qualification:  { type: string,  writable: true }
      specialization: { type: string,  writable: true }
      role:           { type: string,  writable: true }
      class_id:       { type: integer, writable: true }
      is_active:      { type: boolean, writable: true }
      is_suspended:   { type: boolean, writable: true }
      profile_photo:  { type: string,  writable: true }